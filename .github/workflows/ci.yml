name: CI
on:
  push:
    branches: [master, dev, teaser]
  pull_request:
    branches: [master, dev, teaser]

jobs:
  lint:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  deploy-dev:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev') }}
    runs-on: self-hosted
    needs:
      - lint
      - build
    steps:
      - uses: actions/checkout@v7
      - name: Install docker
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
            NEXT_PUBLIC_UPLOADS_URL=${{ secrets.NEXT_PUBLIC_UPLOADS_URL_DEV }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID_DEV }}
            NEXT_PUBLIC_GOOGLE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_VERIFICATION_DEV }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL_DEV }}
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLIC_KEY_DEV }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT_DEV }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/uttarena/front:${{ github.ref == 'refs/heads/master' && 'master' || 'dev' }}
  deploy-prod:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master') }}
    runs-on: self-hosted
    needs:
      - lint
      - build
    steps:
      - uses: actions/checkout@v7
      - name: Install docker
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_UPLOADS_URL=${{ secrets.NEXT_PUBLIC_UPLOADS_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_GOOGLE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_VERIFICATION }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/uttarena/front:${{ github.ref == 'refs/heads/master' && 'master' || 'dev' }}
